<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MeNotebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран входа -->
    <div id="auth-screen">
        <h2>MeNotebook</h2>
        <button id="google-login">Войти через Google</button>
    </div>

    <!-- Главное меню (список тетрадей) -->
    <div id="dashboard" style="display:none;">
        <h2>Мои тетради</h2>
        <button id="create-btn">Создать тетрадь</button>
        <div id="notebooks-list"></div>
    </div>

    <!-- Редактор тетради -->
    <div id="editor" style="display:none;">
        <div class="toolbar">Инструменты</div>
        <div class="pages-container">
            <div class="page cover">Обложка тетради</div>
            <div class="page">Страница 1</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
