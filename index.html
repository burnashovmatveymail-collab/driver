<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flight Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud-overlay">
        <div id="hud-pitch-scale">УГОЛ: <span id="pitch-val">0</span>°</div>
        <div id="hud-alt-scale">ВЫС: <span id="alt-val">0</span>m</div>
    </div>

    <div id="info">
        Тяга: <span id="throttle">0</span>%<br>
        Скорость: <span id="speed">0</span> km/h
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
