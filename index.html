<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D First-Person Driving Game</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #87ceeb;
            user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glow-text {
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }
        .dashboard-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- Quick Control Hint Banner (Click to Lock Mouse) -->
    <div id="click-hint" class="absolute top-6 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-opacity duration-500">
        <div class="dashboard-panel px-6 py-3 rounded-full border-sky-500/40 text-center shadow-2xl flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping"></span>
            <p class="text-xs md:text-sm font-orbitron text-slate-200 tracking-wide">
                <span class="text-sky-400 font-bold">Click anywhere</span> to look around | <span class="text-slate-300">Q / E:</span> Steer | <span class="text-slate-300">Space:</span> Gas | <span class="text-slate-300">Shift:</span> Brake
            </p>
        </div>
    </div>

    <!-- HUD / Dashboard UI Overlay -->
    <div id="hud" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-6">
        <!-- Top bar -->
        <div class="flex justify-between items-center w-full max-w-5xl mx-auto">
            <div class="dashboard-panel px-5 py-2.5 rounded-xl border-sky-500/30 flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="font-orbitron font-bold text-xs tracking-widest text-slate-300">SYSTEM ACTIVE</span>
            </div>
            <div class="dashboard-panel px-6 py-2.5 rounded-xl border-sky-500/30 text-right">
                <div class="text-xs text-slate-400 font-orbitron">DISTANCE</div>
                <div id="distance-display" class="font-orbitron font-black text-lg text-sky-400">0.00 km</div>
            </div>
        </div>

        <!-- Bottom Dashboard Gauges -->
        <div class="w-full max-w-xl mx-auto flex items-end justify-between gap-4">
            <!-- Gear & RPM Panel -->
            <div class="dashboard-panel p-4 rounded-2xl flex items-center gap-6 shadow-2xl">
                <div class="text-center">
                    <div class="text-xs text-slate-400 font-orbitron">GEAR</div>
                    <div id="gear-display" class="font-orbitron font-black text-3xl text-sky-400">D</div>
                </div>
                <div class="border-l border-slate-700 pl-6">
                    <div class="text-xs text-slate-400 font-orbitron mb-1">RPM</div>
                    <div class="w-32 bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                        <div id="rpm-bar" class="h-full bg-gradient-to-r from-emerald-500 via-amber-500 to-rose-500 rounded-full transition-all duration-100" style="width: 20%;"></div>
                    </div>
                </div>
            </div>

            <!-- Speedometer Panel -->
            <div class="dashboard-panel px-8 py-5 rounded-2xl text-center shadow-2xl border-sky-500/40">
                <div class="text-xs text-slate-400 font-orbitron tracking-wider">SPEED</div>
                <div class="flex items-baseline justify-center gap-1">
                    <span id="speed-display" class="font-orbitron font-black text-5xl text-white glow-text">0</span>
                    <span class="text-xs text-sky-400 font-orbitron font-bold">KM/H</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Logic Script -->
    <script>
        // --- GAME STATE & VARIABLES ---
        let scene, camera, renderer, audioCtx;
        let carGroup, steeringWheel;
        let roadChunks = [];
        let clouds = [];
        const chunkSize = 100;
        const totalChunks = 14;

        let car = {
            pos: new THREE.Vector3(4.5, 0, 0), // Spawn on the roadside (side.png)
            speed: 0,
            maxSpeed: 1.8,
            accel: 0.015,
            brake: 0.04,
            friction: 0.004,
            steering: 0,
            maxSteering: 0.035,
            steeringSpeed: 0.05,
            rotationY: 0,
            distanceTraveled: 0
        };

        let keys = { space: false, shift: false, q: false, e: false };
        let mouseLook = { x: 0, y: 0, targetX: 0, targetY: 0 };

        // Audio nodes
        let engineOsc, engineGain;

        // --- TEXTURE LOADER ---
        const textureLoader = new THREE.TextureLoader();

        function loadTexture(path, repeatX = 1, repeatY = 1) {
            const texture = textureLoader.load(
                path,
                (tex) => {
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.repeat.set(repeatX, repeatY);
                },
                undefined,
                (err) => {
                    console.warn(`Could not load texture at ${path}. Using fallback color.`);
                }
            );
            return texture;
        }

        const grassTex = loadTexture('texture/grass.png', 40, 40);
        const roadTex = loadTexture('texture/road.png', 1, 20);
        const sideTex = loadTexture('texture/side.png', 1, 20);
        const sunTex = loadTexture('texture/sun.png');
        const cloudTex = loadTexture('texture/cloud.png');

        // --- INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene & Blue Sky Background
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            // Camera (First-person driver perspective)
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            sunLight.position.set(200, 300, -200);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Create Sun in Sky
            const sunMat = new THREE.SpriteMaterial({ map: sunTex, color: 0xffffee, transparent: true });
            const sunSprite = new THREE.Sprite(sunMat);
            sunSprite.scale.set(80, 80, 1);
            sunSprite.position.set(300, 400, -500);
            scene.add(sunSprite);

            // Create Drifting Clouds
            for (let i = 0; i < 15; i++) {
                const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.8 });
                const cloudSprite = new THREE.Sprite(cloudMat);
                const scale = 50 + Math.random() * 60;
                cloudSprite.scale.set(scale, scale * 0.6, 1);
                cloudSprite.position.set(
                    (Math.random() - 0.5) * 800,
                    180 + Math.random() * 100,
                    -Math.random() * 800
                );
                scene.add(cloudSprite);
                clouds.push(cloudSprite);
            }

            // Build Flat World & Car
            buildWorld();
            buildCarCockpit();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            const canvasEl = renderer.domElement;
            window.addEventListener('click', () => {
                if (document.pointerLockElement !== canvasEl) {
                    canvasEl.requestPointerLock();
                }
                initAudio();
            });

            document.addEventListener('pointerlockchange', () => {
                const hint = document.getElementById('click-hint');
                if (document.pointerLockElement === canvasEl) {
                    hint.style.opacity = '0.2';
                } else {
                    hint.style.opacity = '1';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== canvasEl) return;
                mouseLook.targetX -= e.movementX * 0.002;
                mouseLook.targetY -= e.movementY * 0.002;
                mouseLook.targetX = Math.max(-0.8, Math.min(0.8, mouseLook.targetX));
                mouseLook.targetY = Math.max(-0.3, Math.min(0.4, mouseLook.targetY));
            });

            // Start loop immediately
            animate();
        }

        // --- PROCEDURAL FLAT WORLD GENERATION ---
        function buildWorld() {
            for (let i = 0; i < totalChunks; i++) {
                createRoadChunk(-i * chunkSize);
            }
        }

        function createRoadChunk(zPos) {
            const chunkGroup = new THREE.Group();
            chunkGroup.position.z = zPos;

            // 1. Flat Grass Platform (grass.png)
            const grassGeo = new THREE.PlaneGeometry(300, chunkSize);
            const grassMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                color: 0x3b7a57,
                roughness: 0.9
            });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = -0.02;
            grass.receiveShadow = true;
            chunkGroup.add(grass);

            // 2. Road Shoulder / Side (side.png) - where car spawns
            const sideGeo = new THREE.PlaneGeometry(5, chunkSize);
            const sideMat = new THREE.MeshStandardMaterial({
                map: sideTex,
                color: 0xd2b48c,
                roughness: 0.8
            });
            const side = new THREE.Mesh(sideGeo, sideMat);
            side.rotation.x = -Math.PI / 2;
            side.position.set(4.5, 0.0, 0);
            side.receiveShadow = true;
            chunkGroup.add(side);

            // 3. Central Road (road.png)
            const roadGeo = new THREE.PlaneGeometry(8, chunkSize);
            const roadMat = new THREE.MeshStandardMaterial({
                map: roadTex,
                color: 0x334155,
                roughness: 0.7
            });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.01, 0);
            road.receiveShadow = true;
            chunkGroup.add(road);

            scene.add(chunkGroup);
            roadChunks.push({ group: chunkGroup, z: zPos });
        }

        // --- CAR & COCKPIT MODELING ---
        function buildCarCockpit() {
            carGroup = new THREE.Group();
            scene.add(carGroup);

            const cockpitGroup = new THREE.Group();
            
            // Dashboard
            const dashGeo = new THREE.BoxGeometry(2.2, 0.8, 1.2);
            const dashMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
            const dash = new THREE.Mesh(dashGeo, dashMat);
            dash.position.set(0, 0.6, -0.4);
            cockpitGroup.add(dash);

            // Rearview Mirrors
            const mirrorGeo = new THREE.BoxGeometry(0.35, 0.2, 0.05);
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.1 });
            
            const leftMirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            leftMirror.position.set(-1.25, 1.1, -0.5);
            leftMirror.rotation.y = 0.3;
            cockpitGroup.add(leftMirror);

            const rightMirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            rightMirror.position.set(1.25, 1.1, -0.5);
            rightMirror.rotation.y = -0.3;
            cockpitGroup.add(rightMirror);

            const centerMirror = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.05), mirrorMat);
            centerMirror.position.set(0, 1.6, -0.6);
            cockpitGroup.add(centerMirror);

            // Windshield Pillars
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.3 });
            const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), frameMat);
            pillarL.position.set(-1.0, 1.3, -0.6);
            pillarL.rotation.z = -0.2;
            cockpitGroup.add(pillarL);

            const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), frameMat);
            pillarR.position.set(1.0, 1.3, -0.6);
            pillarR.rotation.z = 0.2;
            cockpitGroup.add(pillarR);

            // Hood visible through windshield
            const hoodGeo = new THREE.BoxGeometry(2.0, 0.4, 2.5);
            const hoodMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.3 });
            const hood = new THREE.Mesh(hoodGeo, hoodMat);
            hood.position.set(0, 0.3, -2.0);
            hood.castShadow = true;
            cockpitGroup.add(hood);

            // Steering Wheel
            const wheelGroup = new THREE.Group();
            const rimGeo = new THREE.TorusGeometry(0.35, 0.04, 12, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const rim = new THREE.Mesh(rimGeo, wheelMat);
            rim.rotation.x = Math.PI / 2 + 0.3;
            wheelGroup.add(rim);

            const spokeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 });
            const spoke1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.6, 0.02), spokeMat);
            spoke1.position.y = -0.05;
            spoke1.rotation.x = 0.3;
            wheelGroup.add(spoke1);

            wheelGroup.position.set(0, 0.95, -0.5);
            cockpitGroup.add(wheelGroup);
            steeringWheel = wheelGroup;

            carGroup.add(cockpitGroup);

            // Position Camera inside driver seat
            camera.position.set(0, 1.4, -0.2);
            carGroup.add(camera);
        }

        // --- AUDIO SYSTEM (Web Audio API) ---
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function updateAudio() {
            if (!audioCtx) return;
            const targetFreq = 50 + (car.speed / car.maxSpeed) * 350;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            const targetGain = 0.05 + (car.speed / car.maxSpeed) * 0.2;
            engineGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.1);
        }

        // --- CONTROLS & INPUT ---
        function handleKey(e, isDown) {
            switch (e.code) {
                case 'Space':
                    keys.space = isDown;
                    break;
                case 'ShiftLeft':
                case 'ShiftRight':
                    keys.shift = isDown;
                    break;
                case 'KeyQ':
                    keys.q = isDown;
                    break;
                case 'KeyE':
                    keys.e = isDown;
                    break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- GAME LOOP & PHYSICS ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            // 1. Car Physics & Acceleration
            if (keys.space) {
                car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
            } else if (keys.shift) {
                car.speed = Math.max(0, car.speed - car.brake);
            } else {
                car.speed = Math.max(0, car.speed - car.friction);
            }

            // Steering controls (Q - Left, E - Right)
            if (keys.q) {
                car.steering = Math.min(car.maxSteering, car.steering + car.steeringSpeed * dt);
                car.rotationY += car.steering * (car.speed * 0.5);
            } else if (keys.e) {
                car.steering = Math.max(-car.maxSteering, car.steering - car.steeringSpeed * dt);
                car.rotationY += car.steering * (car.speed * 0.5);
            } else {
                car.steering *= 0.9;
            }

            // Move car forward
            car.pos.z -= car.speed;
            car.pos.x += Math.sin(car.rotationY) * car.speed * 0.5;

            // Update car group position and rotation
            carGroup.position.copy(car.pos);
            carGroup.rotation.y = car.rotationY;

            // Animate Steering Wheel
            if (steeringWheel) {
                steeringWheel.rotation.z = -car.steering * 20;
            }

            // Smooth Mouse Look
            mouseLook.x += (mouseLook.targetX - mouseLook.x) * 0.1;
            mouseLook.y += (mouseLook.targetY - mouseLook.y) * 0.1;
            camera.rotation.y = mouseLook.x;
            camera.rotation.x = mouseLook.y;

            // Distance Traveled & Dashboard UI Updates
            car.distanceTraveled += car.speed * 0.1;
            document.getElementById('speed-display').innerText = Math.floor(car.speed * 110);
            document.getElementById('distance-display').innerText = (car.distanceTraveled / 1000).toFixed(2) + ' km';
            
            const rpmPercent = Math.min(100, 20 + (car.speed / car.maxSpeed) * 80);
            document.getElementById('rpm-bar').style.width = rpmPercent + '%';

            // Infinite Road Chunk Recycling ahead/behind
            roadChunks.forEach(chunk => {
                if (chunk.group.position.z > carGroup.position.z + chunkSize) {
                    const minZ = Math.min(...roadChunks.map(c => c.group.position.z));
                    chunk.group.position.z = minZ - chunkSize;
                }
            });

            // Drift clouds slowly
            clouds.forEach(cloud => {
                cloud.position.x += 0.05;
                if (cloud.position.x > 400) cloud.position.x = -400;
            });

            updateAudio();

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
